name: credentialinghub
include:
  - ../../../eng/docker/services/shared-compose.yml
  - ../../../eng/docker/services/fineract-compose.yml
  - ../../../samples/sample-registrar-server/docker/compose.yml
  - ../../../samples/sample-lib-app/docker/compose.yml

services:
  credentialinghub:
    depends_on:
      certgen:
        condition: service_completed_successfully
      contracts-deployment:
        condition: service_completed_successfully
      registrar:
        condition: service_healthy
      velocity-mongo:
        condition: service_started
      webhook-receiver:
        condition: service_healthy
    image: lfdecentralizedtrust/verii-credentialing-hub:local
    build:
      context: ../../..
      dockerfile: servers/credentialinghub/docker/Dockerfile
      args:
        IMAGE_VERSION: 0.0.0-e2e
        IMAGE_REVISION: e2e
    restart: on-failure
    volumes:
      - httpscert:/certs
    env_file:
      - ../.localdev.env
    environment:
      - SERVER_CERTIFICATE_FILE=/certs/cert.crt
      - SERVER_CERTIFICATE_KEY_FILE=/certs/key.pem
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NOTIFICATIONS_ENABLED=true
      - NOTIFICATIONS_WORKER_MODE=embedded-child
      - NOTIFICATIONS_WEBHOOK_URL=http://webhook-receiver:3000/cih-notification-webhooks
      - NOTIFICATIONS_WEBHOOK_SECRET=e2e-notification-secret
      - NOTIFICATIONS_ALLOW_INSECURE_WEBHOOK_URL=true
      - NOTIFICATIONS_WEBHOOK_TIMEOUT_MS=2000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "NODE_TLS_REJECT_UNAUTHORIZED=0 node -e \"fetch('https://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - 13002:3000

  webhook-receiver:
    image: node:24.14.0-slim@sha256:e8e2e91b1378f83c5b2dd15f0247f34110e2fe895f6ca7719dbb780f929368eb
    init: true
    command: node /webhook-receiver/webhook-receiver.js
    volumes:
      - ./webhook-receiver:/webhook-receiver:ro
    healthcheck:
      test: ["CMD", "bash", "-c", ">/dev/tcp/localhost/3000"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - 13019:3000
