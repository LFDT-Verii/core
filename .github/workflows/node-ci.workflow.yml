# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches: 
      - main
      - release/*.x
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REG: 'ghcr.io'
jobs:
  # Prepare
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      lint-packages: ${{ steps.packages-list.outputs.lint-packages }}
      test-packages: ${{ steps.packages-list.outputs.test-packages }}
      node-versions: '[ "24.x" ]'
      deps-cache-key: ${{ steps.cache-keys.outputs.run-key }}
    strategy:
      matrix:
        node-version: ['24.x']
    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
    - name: Build Cache Keys
      id: cache-keys
      run: |
        echo "shared-key=${{ runner.os }}-${{ matrix.node-version }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"
        echo "run-key=${{ runner.os }}-${{ matrix.node-version }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
    - name: Enable Corepack
      run: corepack enable
    - name: Get pnpm store path
      id: pnpm-store-path
      run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - name: Restore pnpm cache
      id: cache-pnpm-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.pnpm-store-path.outputs.dir }}
          node_modules
          packages/*/node_modules
          samples/*/node_modules
          servers/*/node_modules
          tools/*/node_modules
        key: ${{ steps.cache-keys.outputs.shared-key }}
    - name: Setup Token
      run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
    - name: Install Dependencies
      run: pnpm install --frozen-lockfile --prefer-offline
    - name: Save pnpm cache
      id: cache-pnpm-save
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.pnpm-store-path.outputs.dir }}
          node_modules
          packages/*/node_modules
          samples/*/node_modules
          servers/*/node_modules
          tools/*/node_modules
        key: ${{ steps.cache-keys.outputs.shared-key }}
      if: ${{ steps.cache-pnpm-restore.outputs.cache-hit != 'true' }}
    - name: Save run-scoped Cache
      id: cache-pnpm-save-run
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.pnpm-store-path.outputs.dir }}
          node_modules
          packages/*/node_modules
          samples/*/node_modules
          servers/*/node_modules
          tools/*/node_modules
        key: ${{ steps.cache-keys.outputs.run-key }}
    - name: Split Branch Name
      env:
        BRANCH: ${{ github.event.merge_group.base_ref }}
      id: split-branch-name
      run: echo "fragment=${BRANCH##*/}" >> "$GITHUB_OUTPUT"
      if : github.event_name == 'merge_group'
    - name: Derive SHAs `nx affected` commands~
      uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      with:
        main-branch-name: ${{ github.base_ref || steps.split-branch-name.outputs.fragment }}
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    - name: Get Lint Affected Packages
      run: |
        echo "LINT_PACKAGES_LIST=$(pnpm --silent exec nx show projects --affected --with-target lint --json)" >> "$GITHUB_ENV"
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    - name: Get Lint All Packages
      run: |
        echo "LINT_PACKAGES_LIST=$(pnpm --silent exec nx show projects --with-target lint --json)" >> "$GITHUB_ENV"
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    - name: Get Test Affected Packages
      run: |
        echo "TEST_PACKAGES_LIST=$(pnpm --silent exec nx show projects --affected --with-target test --json)" >> "$GITHUB_ENV"
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    - name: Get Test All Packages
      run: |
        echo "TEST_PACKAGES_LIST=$(pnpm --silent exec nx show projects --with-target test --json)" >> "$GITHUB_ENV"
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    - name: Set Output
      id: packages-list
      run: |
        echo "lint-packages=$LINT_PACKAGES_LIST" >> "$GITHUB_OUTPUT"
        echo "test-packages=$TEST_PACKAGES_LIST" >> "$GITHUB_OUTPUT"

  # Lint
  lint:
    name: Lint
    needs: [prepare]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.lint-packages != '[]'
    strategy:
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.lint-packages) }}
        node-version: ${{ fromJson(needs.prepare.outputs.node-versions) }}
        mongodb-version: ['8.0']
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
    - name: Enable Corepack
      run: corepack enable
    - name: Get pnpm store path
      id: pnpm-store-path
      run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - name: Restore pnpm cache
      id: cache-pnpm-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.pnpm-store-path.outputs.dir }}
          node_modules
          packages/*/node_modules
          samples/*/node_modules
          servers/*/node_modules
          tools/*/node_modules
        key: ${{ needs.prepare.outputs.deps-cache-key }}
    - name: Install Dependencies (fallback)
      if: steps.cache-pnpm-restore.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile --prefer-offline
    - name: Build Libs
      run: pnpm run build:lib
    - name: Lint
      run: pnpm exec nx run "${{ matrix.package }}:lint:ci"
    - name: Create Artifact Name
      run: |
        echo "ARTIFACT_NAME=$(echo '${{ matrix.package }}' | sed -e 's+@+-+g; s+/+-+g')" >> "$GITHUB_ENV"
      if: '!cancelled()'
    - name: Upload Lint Report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: lint${{ env.ARTIFACT_NAME }}
        path: |
          packages/*/eslint-results.json
          samples/*/eslint-results.json
          servers/*/eslint-results.json
          tools/*/eslint-results.json
        if-no-files-found: warn
      if: '!cancelled()'

  # Post Lint
  post-lint:
    name: Post Lint
    needs: [prepare, lint]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.lint-packages != '[]' && !cancelled()
    steps:
    - name: Download All Reports
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: reports
        pattern: lint-*
        merge-multiple: true
    - name: Publish Lint Report
      uses: ataylorme/eslint-annotate-action@5a8d8ab89a57679e90c32750e0f382e9d8570750 # 4.0.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        report-json: "**/eslint-results.json"

  # Test
  test:
    name: Test
    needs: [prepare, lint]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.test-packages != '[]'
    strategy:
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.test-packages) }}
        node-version: ${{ fromJson(needs.prepare.outputs.node-versions) }}
        mongodb-version: ['8.0']
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Start Test Services
      env:
        COMPOSE_FILE: eng/docker/services/test-compose.yml
        MONGO_VERSION: ${{ matrix.mongodb-version }}
      run: docker compose up -d --wait --wait-timeout 120 --quiet-pull || { docker compose ps -a; docker compose logs; exit 1; }
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
    - name: Enable Corepack
      run: corepack enable
    - name: Get pnpm store path
      id: pnpm-store-path
      run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - name: Restore pnpm cache
      id: cache-pnpm-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.pnpm-store-path.outputs.dir }}
          node_modules
          packages/*/node_modules
          samples/*/node_modules
          servers/*/node_modules
          tools/*/node_modules
        key: ${{ needs.prepare.outputs.deps-cache-key }}
    - name: Install Dependencies (fallback)
      if: steps.cache-pnpm-restore.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile --prefer-offline
    - name: Build Libs
      run: pnpm run build:lib
    - name: Run Credential Agent Migrations
      working-directory: ./servers/credentialagent
      run: env MONGO_URI=mongodb://localhost:27017/test-credential-agent pnpm run migrate:up
    - name: Test
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with: 
        timeout_minutes: 10
        max_attempts: 2
        retry_on: timeout
        command: pnpm exec nx run "${{ matrix.package }}:test:ci"
      env:
        IS_CI: true
        NODE_OPTIONS: "--max_old_space_size=4096"
    # Reads the operators the tests sent from Mongo's serverStatus counters. The tool always exits 0, so check its output.
    - name: Check Mongo Operators Against Amazon DocumentDB
      if: matrix.package == '@verii/server-credentialing-hub'
      env:
        COMPAT_TOOL_URL: https://raw.githubusercontent.com/awslabs/amazon-documentdb-tools/076176b302ef0e678e8976d2611eee3c76abbafb/compat-tool/compat.py
        DOCUMENTDB_VERSION: '4.0'
      run: |
        curl -fsSL -o "$RUNNER_TEMP/compat.py" "$COMPAT_TOOL_URL"
        python3 -m venv "$RUNNER_TEMP/compat-venv"
        "$RUNNER_TEMP/compat-venv/bin/pip" install --quiet pymongo==4.15.4
        "$RUNNER_TEMP/compat-venv/bin/python" "$RUNNER_TEMP/compat.py" --version "$DOCUMENTDB_VERSION" \
          --uri 'mongodb://localhost:27017/admin?directConnection=true' | tee "$RUNNER_TEMP/compat.txt"
        if grep -q 'unsupported operators were found' "$RUNNER_TEMP/compat.txt"; then exit 1; fi
    # Azure DocumentDB (formerly Cosmos DB for MongoDB vCore) runs the open-source DocumentDB engine, so run the Hub's tests on it too.
    # The container serves TLS with a self-signed certificate, which the tests trust through CA_FILENAME.
    - name: Start DocumentDB Local
      if: matrix.package == '@verii/server-credentialing-hub'
      env:
        DOCUMENTDB_IMAGE: ghcr.io/documentdb/documentdb/documentdb-local:pg17-1.0.0@sha256:4a341daca29b02dabd0d64c357bc9231868b59ef08c8059058b1e5cedbe3899d
      run: |
        docker run -d --name documentdb-local -p 10260:10260 --health-interval 2s "$DOCUMENTDB_IMAGE" \
          --username test --password test --disable-usage-telemetry
        until [ "$(docker inspect -f '{{.State.Health.Status}}' documentdb-local)" = healthy ]; do
          if [ "$SECONDS" -gt 120 ]; then docker logs documentdb-local; exit 1; fi
          sleep 2
        done
        openssl s_client -connect localhost:10260 </dev/null 2>/dev/null | openssl x509 -out "$RUNNER_TEMP/documentdb-local.pem"
    - name: Test Against DocumentDB Local
      if: matrix.package == '@verii/server-credentialing-hub'
      working-directory: ./servers/credentialinghub
      timeout-minutes: 10
      env:
        IS_CI: true
        NODE_OPTIONS: "--max_old_space_size=4096"
        TLS_MONGO: true
        TEST_MONGO_BASE_URI: mongodb://test:test@localhost:10260
        CA_FILENAME: ${{ runner.temp }}/documentdb-local.pem
      run: pnpm test
    - name: Create Artifact Name
      run: |
        echo "ARTIFACT_NAME=$(echo '${{ matrix.package }}' | sed -e 's+@+-+g; s+/+-+g')" >> "$GITHUB_ENV"
      if: '!cancelled()'
    - name: Upload Test Report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test${{ env.ARTIFACT_NAME }}
        path: |
          packages/*/test-results.junit.xml
          samples/*/test-results.junit.xml
          servers/*/test-results.junit.xml
          tools/*/test-results.junit.xml
        if-no-files-found: warn
      if: '!cancelled()'
    - name: Upload Codecov Report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage${{ env.ARTIFACT_NAME }}
        path: |
          packages/*/lcov.info
          samples/*/lcov.info
          servers/*/lcov.info
          tools/*/lcov.info
        if-no-files-found: warn
      if: '!cancelled()'

  # Post Test
  post-test:
    name: Post Test
    needs: [prepare, test]
    permissions:
      checks: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.test-packages != '[]' && !cancelled()
    steps:
    - name: Download All Test Reports
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: test-results
        pattern: test-*
        merge-multiple: true
    - name: Publish Test Results
      uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
      with:
        report_paths: "**/test-results.junit.xml"
        check_name: Test Results
        detailed_summary: true
        include_passed: false
        fail_on_failure: true
        fail_on_parse_error: true
        require_tests: false
        comment: true
        updateComment: true
  # Coverage Report
  coverage-report:
    name: Coverage Report
    needs: [prepare, test]
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.test-packages != '[]' && !cancelled()
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Download All Coverage Reports
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: coverage-reports
        pattern: coverage-*
    - name: Detect Coverage Reports
      id: coverage-files
      run: |
        REPORT_COUNT=$(find coverage-reports -type f -name "lcov.info" | wc -l | tr -d ' ')
        echo "count=${REPORT_COUNT}" >> "$GITHUB_OUTPUT"
        if [ "${REPORT_COUNT}" -gt 0 ]; then
          echo "has_reports=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_reports=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Fetch PR Base Branch
      if: github.event_name == 'pull_request'
      run: git fetch --no-tags origin "${{ github.base_ref }}"
    - name: Annotate Uncovered Diff Lines
      if: github.event_name == 'pull_request' && steps.coverage-files.outputs.has_reports == 'true'
      continue-on-error: true
      uses: aki77/reviewdog-action-code-coverage@5c6e62eea3dc26b9cae4f44c45dd607b5067bba9 # v2.8.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        lcov_path: "coverage-reports/*/packages/*/lcov.info coverage-reports/*/servers/*/lcov.info coverage-reports/*/tools/*/lcov.info"
        reporter: github-pr-review
        filter_mode: added
        fail_level: none
    - name: PR Coverage Summary (Diff target 98%)
      if: github.event_name == 'pull_request'
      run: |
        SUMMARY_FILE=coverage-summary.md
        JOB_SUMMARY="$GITHUB_STEP_SUMMARY"
        set +e
        GITHUB_STEP_SUMMARY="$SUMMARY_FILE" python3 .github/scripts/coverage_summary.py \
          --mode pr \
          --coverage-dir coverage-reports \
          --compare-branch "origin/${{ github.base_ref }}" \
          --target 98
        STATUS=$?
        set -e
        if [ -f "$SUMMARY_FILE" ]; then
          cat "$SUMMARY_FILE" >> "$JOB_SUMMARY"
        fi
        exit $STATUS
    - name: Run Coverage Summary
      if: github.event_name != 'pull_request'
      run: |
        SUMMARY_FILE=coverage-summary.md
        JOB_SUMMARY="$GITHUB_STEP_SUMMARY"
        set +e
        GITHUB_STEP_SUMMARY="$SUMMARY_FILE" python3 .github/scripts/coverage_summary.py \
          --mode general \
          --coverage-dir coverage-reports
        STATUS=$?
        set -e
        if [ -f "$SUMMARY_FILE" ]; then
          cat "$SUMMARY_FILE" >> "$JOB_SUMMARY"
        fi
        exit $STATUS
    - name: Post Coverage Summary Comment
      if: always() && steps.coverage-files.outputs.has_reports == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('node:fs');

          const marker = '<!-- coverage-summary-comment -->';
          const summaryPath = 'coverage-summary.md';
          if (!fs.existsSync(summaryPath)) {
            console.log('No coverage-summary.md file found; skipping comment.');
            return;
          }

          const summary = fs.readFileSync(summaryPath, 'utf8');
          if (!summary.trim()) {
            console.log('Coverage summary is empty; skipping comment.');
            return;
          }

          const lines = summary.split(/\r?\n/);
          const summaryTitle = lines.find((line) => line.startsWith('### ')) || '### Coverage Summary';

          const extractTableRows = (headerText) => {
            const headerIndex = lines.findIndex((line) => line.trim() === headerText);
            if (headerIndex === -1) return null;

            const tableLines = [];
            for (let i = headerIndex; i < lines.length; i += 1) {
              const current = lines[i].trim();
              if (!current.startsWith('|')) break;
              tableLines.push(current);
            }
            return tableLines.length >= 3 ? tableLines : null;
          };

          const packageTable = extractTableRows('| Package | Coverage | Covered / Total |');
          const fileTable = extractTableRows('| File | Uncovered lines | Coverage | Covered / Total |');

          const packageLines = packageTable
            ? [...packageTable.slice(0, 2), ...packageTable.slice(2, 6)]
            : ['- Coverage package table not found in summary output.'];

          const fileLines = fileTable
            ? [...fileTable.slice(0, 2), ...fileTable.slice(2, 4)]
            : ['- Coverage file table not found in summary output.'];

          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

          let prNumber = context.payload.pull_request?.number;
          if (!prNumber) {
            const headRef = context.ref.replace('refs/heads/', '');
            const { data: pulls } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:${headRef}`,
              per_page: 1,
            });
            if (!pulls.length) {
              console.log(`No open PR found for branch ${headRef}; skipping comment.`);
              return;
            }
            prNumber = pulls[0].number;
          }

          const body = [
            marker,
            '## Coverage Report',
            '',
            summaryTitle,
            '',
            '### Worst 4 packages by coverage',
            ...packageLines,
            '',
            '### Worst 2 files by uncovered lines',
            ...fileLines,
            '',
            `[View full coverage report](${runUrl})`,
          ].join('\n');

          const comments = await github.paginate(github.rest.issues.listComments, {
            ...context.repo,
            issue_number: prNumber,
            per_page: 100,
          });

          const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body,
            });
          }

  # CI Result
  ci-result:
    name: CI Result
    needs: [prepare, lint, post-lint, test, post-test, coverage-report]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && github.event.pull_request.draft == false
    steps:
    - name: Fail on Failure or Draft PR
      run: exit 1
      if: ${{ contains(needs.*.result, 'failure') }}
